spring:
  datasource:
    url: ${MYSQL_DB_URL}/mc_manager?createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  springdoc:
    api-docs:
      enabled: false
      path: /v3/api-docs
    swagger-ui:
      enabled: false
      path: /swagger-ui.html
      display-request-duration: true
      tags-sorter: alpha

server:
  port: 8080

mcmanager:
  data_root_directory: ${DATA_ROOT_DIRECTORY}

  secret_key: ${JWT_SECRET}
  base_domain: ${BASE_DOMAIN}



