spring:
  datasource:
    url: ${MYSQL_DB_URL}/mc_manager?createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

mcmanager:
  data_root_directory: ${DATA_ROOT_DIRECTORY}
  java_8: ${JAVA8_PATH:/opt/java/jdk8/bin/java}
  java_21: ${JAVA21_PATH:/opt/java/jdk21/bin/java}
  java_25: ${JAVA25_PATH:/opt/java/jdk25/bin/java}
  secret_key: ${JWT_SECRET}
  base_domain: ${BASE_DOMAIN}

