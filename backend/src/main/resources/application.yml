spring:
  datasource:
    url: ${MYSQL_DB_URL}/mc_manager?createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

mcmanager:
  data-root-directory: ${DATA-ROOT-DIRECTORY}
  java-8: ${JAVA8-PATH}
  java-21: ${JAVA21-PATH}
  java-25: ${JAVA25-PATH}
  secret-key: ${JWT_SECRET}

