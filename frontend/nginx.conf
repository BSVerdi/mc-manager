server {
    listen 80;
    server_name _;

    # Onde o build do React (Vite) fica depois do `npm run build`
    root /usr/share/nginx/html;
    index index.html;

    # Tamanho maximo de upload que o Nginx aceita repassar --
    client_max_body_size 2G;

    # --- 1. SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 2. Proxy para a API REST do backend ---
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3. Proxy para o WebSocket (STOMP) ---
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # mantem a conexao WS viva por longos periodos
        proxy_send_timeout 86400s;
    }

    # --- 4. Fotos de perfil, servidas direto pelo Nginx ---
    location ^~ /images/ {
        alias /usr/share/nginx/images/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off; # opcional -- reduz ruido de log para requisicoes de imagem
    }

    # --- 5. Cache agressivo para os assets do build (JS/CSS com hash no nome) ---
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- 6. Compressao Gzip, reduz tamanho de transferencia ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
}